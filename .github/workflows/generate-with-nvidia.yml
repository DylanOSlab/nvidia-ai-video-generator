name: Generate Video with NVIDIA

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Chu de video"
        required: true
        type: string
      language:
        description: "Ngon ngu loi doc"
        required: true
        default: "Vietnamese"
        type: choice
        options:
          - Vietnamese
          - English
      voice:
        description: "Giong Edge TTS"
        required: true
        default: "vi-VN-HoaiMyNeural"
        type: choice
        options:
          - vi-VN-HoaiMyNeural
          - vi-VN-NamMinhNeural
          - en-US-AriaNeural
          - en-US-GuyNeural
      scenes:
        description: "So canh"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "6"
          - "8"
      duration:
        description: "Thoi luong du kien"
        required: true
        default: "30"
        type: choice
        options:
          - "30"
          - "50"
          - "60"
      style:
        description: "Phong cach hinh anh"
        required: true
        default: "cinematic, realistic, modern, high detail"
        type: string

permissions:
  contents: read

concurrency:
  group: nvidia-video-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate script with NVIDIA NIM
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
        run: |
          python generate_script_nvidia.py \
            --topic "${{ inputs.topic }}" \
            --language "${{ inputs.language }}" \
            --voice "${{ inputs.voice }}" \
            --scenes "${{ inputs.scenes }}" \
            --duration "${{ inputs.duration }}" \
            --style "${{ inputs.style }}" \
            --output scripts/generated_script.txt

      - name: Preview generated script
        run: sed -n '1,220p' scripts/generated_script.txt

      - name: Create output directory
        run: mkdir -p output

      - name: Render vertical video
        run: |
          python generate_video.py \
            --script scripts/generated_script.txt \
            --out output/final_video.mp4 \
            --voice "${{ inputs.voice }}"

      - name: Verify output
        run: |
          test -s output/final_video.mp4
          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            output/final_video.mp4

      - name: Upload video and script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-video-${{ github.run_number }}
          path: |
            output/final_video.mp4
            scripts/generated_script.txt
          if-no-files-found: warn
          retention-days: 7
